name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and Bungie tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p paraforge-core -p paraforge-bungie --all-targets -- -D warnings
      - run: cargo test -p paraforge-core -p paraforge-bungie

  windows:
    name: Windows app build and test installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm typecheck
      - run: pnpm build
      # A test installer (debug build) that can be downloaded from the run's Artifacts. Each build
      # gets its own version (0.1.<run number>) so installed copies can tell a newer one apart. With
      # the updater key set as a secret, the build is also signed for in-app updates.
      - name: Build test installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          signed=false
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then signed=true; fi
          pnpm tauri build --debug --bundles nsis \
            --config "{\"version\":\"0.1.${{ github.run_number }}\",\"bundle\":{\"createUpdaterArtifacts\":$signed}}"
      - uses: actions/upload-artifact@v4
        with:
          name: ParaForge-test-installer-windows
          path: |
            target/debug/bundle/nsis/*.exe
            target/debug/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 14

  # Publishes the signed test build as the rolling "test-build" release, where installed copies of
  # ParaForge look for updates. Skipped for pull requests from forks and until the key is set.
  publish:
    name: Publish test build for in-app updates
    needs: windows
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    concurrency:
      group: publish-test-build
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ParaForge-test-installer-windows
          path: build
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: 0.1.${{ github.run_number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          exe=$(ls build/*.exe | head -n1)
          if [ ! -f "$exe.sig" ]; then
            echo "No updater signature (TAURI_SIGNING_PRIVATE_KEY not set); nothing to publish."
            exit 0
          fi
          name=$(basename "$exe")
          url="https://github.com/$REPO/releases/download/test-build/$name"
          jq -n --arg v "$VERSION" --arg sig "$(cat "$exe.sig")" --arg url "$url" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, notes: "ParaForge test build", pub_date: $date,
              platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' > build/latest.json
          if ! gh release view test-build --repo "$REPO" >/dev/null 2>&1; then
            gh release create test-build --repo "$REPO" --prerelease --target "$SHA" \
              --title "ParaForge test build" --notes "Rolling test build. ParaForge installs updates from here by itself."
          fi
          # A newer build may already be published by a later run; never go backwards.
          current=$(gh release download test-build --repo "$REPO" --pattern latest.json --output - 2>/dev/null | jq -r .version || echo "0.1.0")
          if [ "${current##*.}" -ge "${VERSION##*.}" ] 2>/dev/null; then
            echo "Release already has $current; skipping $VERSION."
            exit 0
          fi
          gh release upload test-build --repo "$REPO" --clobber "$exe" build/latest.json
          # Old installers are no longer needed once latest.json points at the new one.
          gh release view test-build --repo "$REPO" --json assets --jq '.assets[].name' \
            | grep -E '\.exe$' | grep -vxF "$name" | while read -r old; do
              gh release delete-asset test-build "$old" --repo "$REPO" --yes
            done
