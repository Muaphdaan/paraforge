name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and Bungie tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p paraforge-core -p paraforge-bungie --all-targets -- -D warnings
      - run: cargo test -p paraforge-core -p paraforge-bungie

  windows:
    name: Windows app build and test installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm typecheck
      - run: pnpm build
      # A test installer (debug build) that can be downloaded from the run's Artifacts. Each build
      # gets its own version (0.1.<run number>) so installed copies can tell a newer one apart.
      - name: Build test installer
        shell: bash
        run: pnpm tauri build --debug --bundles nsis --config '{"version":"0.1.${{ github.run_number }}"}'
      - uses: actions/upload-artifact@v4
        with:
          name: ParaForge-test-installer-windows
          path: target/debug/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # Publishes the test build as the rolling "test-build" release, where installed copies of
  # ParaForge look for updates (latest.json: version, installer address, SHA-256). Skipped for pull
  # requests from forks.
  publish:
    name: Publish test build for in-app updates
    needs: windows
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    concurrency:
      group: publish-test-build
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ParaForge-test-installer-windows
          path: build
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: 0.1.${{ github.run_number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          exe=$(ls build/*.exe | head -n1)
          name=$(basename "$exe")
          url="https://github.com/$REPO/releases/download/test-build/$name"
          jq -n --arg v "$VERSION" --arg url "$url" --arg sha "$(sha256sum "$exe" | cut -d' ' -f1)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, url: $url, sha256: $sha, pub_date: $date}' > build/latest.json
          if ! gh release view test-build --repo "$REPO" >/dev/null 2>&1; then
            gh release create test-build --repo "$REPO" --prerelease --target "$SHA" \
              --title "ParaForge test build" --notes "Rolling test build. ParaForge installs updates from here by itself."
          fi
          # A later run may have published a newer build already; never go backwards.
          current=$( (gh release download test-build --repo "$REPO" --pattern latest.json --output - 2>/dev/null || true) | jq -r '.version // "0.1.0"' 2>/dev/null || echo 0.1.0)
          if [ "${current##*.}" -ge "${VERSION##*.}" ] 2>/dev/null; then
            echo "Release already has $current; skipping $VERSION."
            exit 0
          fi
          # Installer first, then latest.json, so the manifest never points at a missing file.
          gh release upload test-build --repo "$REPO" --clobber "$exe"
          gh release upload test-build --repo "$REPO" --clobber build/latest.json
          gh release view test-build --repo "$REPO" --json assets --jq '.assets[].name' \
            | { grep -E '\.exe$' || true; } | { grep -vxF "$name" || true; } | while read -r old; do
              gh release delete-asset test-build "$old" --repo "$REPO" --yes
            done
