[package]
name = "paraforge-bungie"
description = "Bungie.net API client for ParaForge: OAuth sign-in and token refresh. No UI."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "form", "json"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url = "=2.5.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }
